<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/inicio.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>Gestor de Tareas</title>
</head>

<body>
<h1>Gestor de tareas</h1>
<div class="layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="contenido-principal">

        <section>
            <h2>Resumen de tareas</h2>

            <div class="estadisticas">

                <article class="tarjeta">
                    <h3>Tareas vencidas</h3>
                    <p th:text="${estadisticas.tareasVencidas}">0</p>
                </article>

                <article class="tarjeta">
                    <h3>Vencen hoy</h3>
                    <p th:text="${estadisticas.tareasVenceHoy}">0</p>
                </article>

                <article class="tarjeta">
                    <h3>Próximas a vencer</h3>
                    <p th:text="${estadisticas.tareasVenceProxima}">0</p>
                </article>

                <article class="tarjeta">
                    <h3>En plazo</h3>
                    <p th:text="${estadisticas.tareasEnPlazo}">0</p>
                </article>
                <article class="tarjeta">
                    <h3>Pendientes</h3>
                    <p th:text="${estadisticas.tareasPendientes}">0</p>
                </article>

                <article class="tarjeta">
                    <h3>En progreso</h3>
                    <p th:text="${estadisticas.tareasEnProgreso}">0</p>
                </article>

                <article class="tarjeta">
                    <h3>Completadas</h3>
                    <p th:text="${estadisticas.tareasCompletadas}">0</p>
                </article>

                <article class="tarjeta">
                    <h3>Canceladas</h3>
                    <p th:text="${estadisticas.tareasCanceladas}">0</p>
                </article>
            </div>
        </section>

    </main>

</div>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
