<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
</head>

<body>

<h1>Gestor de tareas</h1>

<section>
    <h2>Resumen de tareas</h2>

    <div class="estadisticas">

        <article class="tarjeta">
            <h3>Tareas vencidas</h3>
            <p th:text="${estadisticas.tareasVencidas}">0</p>
        </article>

        <article class="tarjeta">
            <h3>Vencen hoy</h3>
            <p th:text="${estadisticas.tareasVenceHoy}">0</p>
        </article>

        <article class="tarjeta">
            <h3>Próximas a vencer</h3>
            <p th:text="${estadisticas.tareasVenceProxima}">0</p>
        </article>

        <article class="tarjeta">
            <h3>En plazo</h3>
            <p th:text="${estadisticas.tareasEnPlazo}">0</p>
        </article>
        <article class="tarjeta">
            <h3>Pendientes</h3>
            <p th:text="${estadisticas.tareasPendientes}">0</p>
        </article>

        <article class="tarjeta">
            <h3>En progreso</h3>
            <p th:text="${estadisticas.tareasEnProgreso}">0</p>
        </article>

        <article class="tarjeta">
            <h3>Completadas</h3>
            <p th:text="${estadisticas.tareasCompletadas}">0</p>
        </article>

        <article class="tarjeta">
            <h3>Canceladas</h3>
            <p th:text="${estadisticas.tareasCanceladas}">0</p>
        </article>
    </div>
</section>

<br>

<section>
    <h2>Administración</h2>

    <a class="boton" th:href="@{/gestor-de-tareas/tareas}">Ver tareas</a>
    <a class="boton" th:href="@{/gestor-de-tareas/tareas/nueva}">Crear tarea</a>
    <br>

    <a class="boton" th:href="@{/gestor-de-tareas/categorias}">Ver categorías</a>
    <a class="boton" th:href="@{/gestor-de-tareas/categorias/nueva}">Crear categoría</a>
    <br>

    <a class="boton" th:href="@{/gestor-de-tareas/usuarios}">Ver usuarios</a>
    <a class="boton" th:href="@{/gestor-de-tareas/usuarios/nuevo}">Crear usuario</a>

</section>

<style>
    body {
        background-color: #f6c8cf;
    }

    h1 {
        background-color: #ffffff;
        color: #000000;
        padding: 5px 15px;
        margin: 0;
    }

    .boton {
        display: inline-block;
        background-color: #c55160;
        color: white;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 8px;
        margin: 5px;
        border: none;
        font-size: 16px;
    }

    .boton:hover {
        background-color: #a83e4d;
    }

    .estadisticas {
        display: grid;
        grid-template-columns: repeat(4, 200px);
        gap: 20px;
        margin: 12px 0;
    }

    .tarjeta {
        background-color: #c55160;
        width: 200px;
        height: 100px;
        padding: 5px;
        border-radius: 7px;
        text-align: center;
    }

    .tarjeta h3 {
        margin-bottom: 4px;
        color: #f6c8cf;
    }

    .tarjeta p {
        margin-top: 0;
        color: #f6c8cf;
        font-size: 23px;
        font-weight: bold;
    }
</style>

</body>
</html>
