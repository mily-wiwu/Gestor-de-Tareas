<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva categoria</title>
</head>
<body>

<h1>Crear una categoria</h1>
<br>

<style>
    body {
        background-color: #f6c8cf;
    }

    h1 {
        background-color: #ffffff;
        color: #000000;
        padding: 5px 15px;
        margin: 0;
    }

    label {
        font-size: 20px;
    }

    input {
        background-color: white;
        border: 1px solid #c55160;
        border-radius: 8px;
        padding: 10px;
        font-size: 15px;
        outline: none;
    }

    textarea {
        background-color: white;
        border: 1px solid #c55160;
        border-radius: 8px;
        padding: 10px;
        font-size: 15px;
        width: 300px;
        height: 100px;
        resize: vertical;
        box-sizing: border-box;
    }

    .boton {
        display: inline-block;
        background-color: #c55160;
        color: white;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 8px;
        margin: 5px;
        border: none;
        font-size: 16px;
    }

    .boton:hover {
        background-color: #a83e4d;
    }

</style>

<form th:action="@{/gestor-de-tareas/categorias/nueva}" method="post">
    <label for="nombre">Nombre:</label>
    <br>
    <input type="text" id="nombre" name="nombre" required>

    <br><br>

    <label for="descripcion">Descripción:</label>
    <br>
    <textarea id="descripcion" name="descripcion"></textarea>

    <br><br>

    <button type="submit" class="boton">Crear categoria</button>
    <a class="boton" th:href="@{/gestor-de-tareas/categorias}">Volver a mis categorias</a>
</form>

</body>
</html>
