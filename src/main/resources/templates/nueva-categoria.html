<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>Nueva categoria</title>
</head>
<body>
<h1>Crear una categoria</h1>


<div class="layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="contenido-principal">

        <form th:action="@{/gestor-de-tareas/categorias/nueva}" method="post">
            <label for="nombre">Nombre:</label>
            <br>
            <input type="text" id="nombre" name="nombre" required>

            <br><br>

            <label for="descripcion">Descripción:</label>
            <br>
            <textarea id="descripcion" name="descripcion"></textarea>

            <br><br>

            <button type="submit" class="boton">Crear categoria</button>
            <a class="boton" th:href="@{/gestor-de-tareas/categorias}">Volver a mis categorias</a>
        </form>

    </main>

</div>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
