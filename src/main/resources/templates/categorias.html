
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>Mis categorías</title>
</head>
<body>
<h1>Mis categorias</h1>

<div class="layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="contenido-principal">

        <p th:if="${#lists.isEmpty(categorias)}">
            No hay categorías registradas.
        </p>

        <table th:unless="${#lists.isEmpty(categorias)}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="categoria : ${categorias}">
                <td th:text="${categoria.id}"></td>
                <td th:text="${categoria.nombre}"></td>
                <td th:text="${categoria.descripcion}"></td>
                <td>
                    <form th:action="@{/gestor-de-tareas/categorias/eliminar}" method="post">
                        <input type="hidden" name="id" th:value="${categoria.id}">
                        <button type="submit" class="boton boton-pequeno">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <br>

        <a class="boton" th:href="@{/gestor-de-tareas/categorias/nueva}">Crear categoría</a>
        <a class="boton" th:href="@{/gestor-de-tareas}">Volver al inicio</a>

    </main>

</div>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
