
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis categorías</title>
</head>
<body>

<h1>Mis categorias</h1>

<style>
    body {
        background-color: #e5eeff;
    }

    table {
        border-collapse: collapse;
        width: 100%;
    }

    th, td {
        padding: 12px 10px;
        text-align: left;
    }

    th {
        background-color: #bcc6d9;
    }

    td {
        background-color: whitesmoke;
    }

    tr {
        border-bottom: 1px solid #cccccc;
    }
</style>

<p th:if="${#lists.isEmpty(categorias)}">
    No hay categorías registradas.
</p>

<table th:unless="${#lists.isEmpty(categorias)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Acciones</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="categoria : ${categorias}">
        <td th:text="${categoria.id}"></td>
        <td th:text="${categoria.nombre}"></td>
        <td th:text="${categoria.descripcion}"></td>
        <td>
            <form th:action="@{/gestor-de-tareas/categorias/eliminar}" method="post">
                <input type="hidden" name="id" th:value="${categoria.id}">
                <button type="submit">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<br>

<a th:href="@{/gestor-de-tareas/categorias/nueva}">Crear categoría</a>
<br>
<a th:href="@{/gestor-de-tareas}">Volver al inicio</a>
</body>
</html>
