<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis tareas</title>
</head>
<body>

<h1>Mis tareas</h1>

<style>
    body {
        background-color: #f6c8cf;
    }

    h1 {
        background-color: #ffffff;
        color: #000000;
        padding: 5px 15px;
        margin: 0;
    }

    .descripcion {
        max-width: 220px;
        padding: 12px;
        vertical-align: middle;
    }

    .texto-descripcion {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        overflow-wrap: anywhere;
    }

    .texto-descripcion.expandido {
        display: block;
        overflow: visible;
    }

    .boton-descripcion {
        background: none;
        border: none;
        color: #c55160;
        cursor: pointer;
        padding: 4px 0;
        font-size: 13px;
        font-weight: bold;
    }

    table {
        border-collapse: collapse;
        width: 100%;
    }

    th, td {
        padding: 12px 10px;
        text-align: left;
    }

    th {
        background-color: #c55160;
        color: #ecd4d4;
    }

    td {
        background-color: whitesmoke;
    }

    tr {
        border-bottom: 1px solid #cccccc;
    }

    .boton {
        display: inline-block;
        background-color: #c55160;
        color: white;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 8px;
        margin: 5px;
        border: none;
        font-size: 16px;
    }

    .boton:hover {
        background-color: #a83e4d;
    }

    .boton-pequeno {
        padding: 5px 10px;
        font-size: 15px;
    }

    input {
        background-color: white;
        border: 1px solid #c55160;
        border-radius: 8px;
        padding: 10px;
        font-size: 15px;
        outline: none;
    }

    select {
        background-color: white;
        border: 1px solid #c55160;
        border-radius: 8px;
        padding: 10px;
        font-size: 15px;
        cursor: pointer;
    }

    label {
        font-size: 20px;
    }
</style>

<h2>Buscar tareas</h2>
<form th:action="@{/gestor-de-tareas/tareas}" method="get">
    <label>Buscar por título:</label>
    <input type="text"
           name="titulo"
           placeholder="Escribe un título..."
           th:value="${titulo}">
    <br><br>

    <label>Categoría:</label>
    <select name="idCategoria">
        <option value="">Todas</option>
        <option th:each="categoria : ${categorias}"
                th:value="${categoria.id}"
                th:text="${categoria.nombre}"
                th:selected="${idCategoria != null and idCategoria == categoria.id}">
        </option>
    </select>
    <br><br>

    <label>Prioridad:</label>
    <select name="prioridad">
        <option value="">Todas</option>
        <option th:each="p : ${T(com.example.Gestor_de_tareas.modelo.Prioridad).values()}"
                th:value="${p}"
                th:text="${p}"
                th:selected="${prioridadSeleccionada == p}">
        </option>
    </select>
    <br><br>

    <label>Estado:</label>
    <select name="estado">
        <option value="">Todos</option>
        <option th:each="e : ${T(com.example.Gestor_de_tareas.modelo.EstadoTarea).values()}"
                th:value="${e}"
                th:text="${#strings.replace(e.name(), '_', ' ')}"
                th:selected="${estadoSeleccionado == e}">
        </option>
    </select>
    <br><br>

    <button type="submit" class="boton">Buscar</button>

    <a class="boton" th:href="@{/gestor-de-tareas/tareas}">Limpiar filtros</a>

</form>
<hr>

<p th:if="${#lists.isEmpty(tareas)}">
    No hay tareas registradas.
</p>

<table th:unless="${#lists.isEmpty(tareas)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th>Prioridad</th>
        <th>Fecha límite</th>
        <th>Acciones</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="tarea : ${tareas}">
        <td th:text="${tarea.id}"></td>
        <td th:text="${tarea.titulo}"></td>
        <td class="descripcion">
            <div class="texto-descripcion"
                 th:text="${tarea.descripcion}">
            </div>
            <button type="button" class="boton-descripcion" onclick="mostrarDescripcion(this)">
                Ver más
            </button>
        </td>
        <td th:text="${#strings.replace(tarea.estado.name(), '_', ' ')}"></td>
        <td th:text="${tarea.prioridad}"></td>
        <td th:text="${tarea.fechaLimite}"></td>

        <td>
            <form th:action="@{/gestor-de-tareas/tareas/estado}" method="post">
                <input type="hidden" name="id" th:value="${tarea.id}">
                <select name="estado">
                    <option th:each="e : ${T(com.example.Gestor_de_tareas.modelo.EstadoTarea).values()}"
                            th:value="${e}"
                            th:text="${#strings.replace(e.name(), '_', ' ')}"
                            th:selected="${e == tarea.estado}">
                    </option>
                </select>
                <button type="submit" class="boton boton-pequeno">Cambiar estado</button>
            </form>
            <form th:action="@{/gestor-de-tareas/tareas/usuario}" method="post">
                <input type="hidden" name="id" th:value="${tarea.id}">
                <select name="usuarioId">
                    <option value="">Sin asignar</option>
                    <option th:each="usuario : ${usuarios}"
                            th:value="${usuario.id}"
                            th:text="   ${usuario.nombre}"
                            th:selected="${tarea.usuario != null and usuario.id == tarea.usuario.id}">
                    </option>
                </select>
                <button type="submit" class="boton boton-pequeno">Asignar usuario</button>
            </form>
            <form th:action="@{/gestor-de-tareas/tareas/editar/{id}(id=${tarea.id})}" method="get">
                <button type="submit" class="boton boton-pequeno">Editar</button>
            </form>
            <form th:action="@{/gestor-de-tareas/tareas/eliminar}" method="post">
                <input type="hidden" name="id" th:value="${tarea.id}">
                <button type="submit" class="boton boton-pequeno">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<br>
<a class="boton" th:href="@{/gestor-de-tareas/tareas/nueva}">Crear tarea</a>
<a class="boton" th:href="@{/gestor-de-tareas}">Volver al inicio</a>

<script>
    function mostrarDescripcion(boton) {
        const texto = boton.previousElementSibling;

        texto.classList.toggle("expandido");

        if (texto.classList.contains("expandido")) {
            boton.textContent = "Ver menos";
        } else {
            boton.textContent = "Ver más";
        }
    }
</script>

<script>
    function comprobarDescripciones() {
        document.querySelectorAll(".texto-descripcion").forEach(texto => {

            const boton = texto.nextElementSibling;

            if (texto.scrollHeight > texto.clientHeight) {
                boton.style.display = "inline-block";
            } else {
                boton.style.display = "none";
            }
        });
    }

    window.addEventListener("load", comprobarDescripciones);
</script>
</body>
</html>
