<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>Nuevo usuario</title>
</head>
<body>
<h1>Crear un usuario</h1>

<div class="layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="contenido-principal">

        <form th:action="@{/gestor-de-tareas/usuarios/nuevo}" method="post">
            <label for="id">ID (RUT o Pasaporte):</label>
            <br>
            <input type="text" id="id" name="id" required>

            <br><br>

            <label for="nombre">Nombre:</label>
            <br>
            <textarea id="nombre" name="nombre"></textarea>

            <br><br>

            <button type="submit" class="boton">Crear usuario</button>
            <a class="boton" th:href="@{/gestor-de-tareas/usuarios}">Volver a mis usuarios</a>
        </form>

    </main>

</div>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
