<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis usuarios</title>
</head>
<body>

<h1>Mis usuarios</h1>
<br>

<style>
    body {
        background-color: #f6c8cf;
    }

    h1 {
        background-color: #ffffff;
        color: #000000;
        padding: 5px 15px;
        margin: 0;
    }

    table {
        border-collapse: collapse;
        width: 100%;
    }

    th, td {
        padding: 12px 10px;
        text-align: left;
    }

    th {
        background-color: #c55160;
        color: #ecd4d4;
    }

    td {
        background-color: whitesmoke;
    }

    tr {
        border-bottom: 1px solid #cccccc;
    }

    .boton {
        display: inline-block;
        background-color: #c55160;
        color: white;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 8px;
        margin: 5px;
        border: none;
        font-size: 16px;
    }

    .boton:hover {
        background-color: #a83e4d;
    }

    .boton-pequeno {
        padding: 5px 10px;
        font-size: 15px;
    }
</style>

<p th:if="${#lists.isEmpty(usuarios)}">
    No hay usuarios registrados.
</p>

<table th:unless="${#lists.isEmpty(usuarios)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Acciones</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="usuario : ${usuarios}">
        <td th:text="${usuario.id}"></td>
        <td th:text="${usuario.nombre}"></td>
        <td>
            <form th:action="@{/gestor-de-tareas/usuarios/eliminar}" method="post">
                <input type="hidden" name="id" th:value="${usuario.id}">
                <button type="submit" class="boton boton-pequeno">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a class="boton" th:href="@{/gestor-de-tareas/usuarios/nuevo}">Crear usuario</a>
<a class="boton" th:href="@{/gestor-de-tareas}">Volver al inicio</a>
</body>
</html>
