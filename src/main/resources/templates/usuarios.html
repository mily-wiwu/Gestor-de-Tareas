<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>Mis usuarios</title>
</head>
<body>
<h1>Mis usuarios</h1>

<div class="layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="contenido-principal">

        <p th:if="${#lists.isEmpty(usuarios)}">
            No hay usuarios registrados.
        </p>

        <table th:unless="${#lists.isEmpty(usuarios)}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.id}"></td>
                <td th:text="${usuario.nombre}"></td>
                <td>
                    <form th:action="@{/gestor-de-tareas/usuarios/eliminar}" method="post">
                        <input type="hidden" name="id" th:value="${usuario.id}">
                        <button type="submit" class="boton boton-pequeno">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <a class="boton" th:href="@{/gestor-de-tareas/usuarios/nuevo}">Crear usuario</a>
        <a class="boton" th:href="@{/gestor-de-tareas}">Volver al inicio</a>

    </main>

</div>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
