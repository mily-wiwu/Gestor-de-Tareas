<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis usuarios</title>
</head>
<body>

<h1>Mis usuarios</h1>

<style>
    body {
        background-color: #e5eeff;
    }

    table {
        border-collapse: collapse;
        width: 100%;
    }

    th, td {
        padding: 12px 10px;
        text-align: left;
    }

    th {
        background-color: #bcc6d9;
    }

    td {
        background-color: whitesmoke;
    }

    tr {
        border-bottom: 1px solid #cccccc;
    }
</style>

<p th:if="${#lists.isEmpty(usuarios)}">
    No hay usuarios registrados.
</p>

<table th:unless="${#lists.isEmpty(usuarios)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Acciones</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="usuario : ${usuarios}">
        <td th:text="${usuario.id}"></td>
        <td th:text="${usuario.nombre}"></td>
        <td>
            <form th:action="@{/gestor-de-tareas/usuarios/eliminar}" method="post">
                <input type="hidden" name="id" th:value="${usuario.id}">
                <button type="submit">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/gestor-de-tareas/usuarios/nuevo}">Crear usuario</a>
<br>
<a th:href="@{/gestor-de-tareas}">Volver al inicio</a>
</body>
</html>
