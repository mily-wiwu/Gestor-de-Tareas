<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva tarea</title>
</head>
<body>

<h1>Crear una tarea</h1>
<br>

<style>
    body {
        background-color: #f6c8cf;
    }

    input {
        background-color: white;
        border: 1px solid #c55160;
        border-radius: 8px;
        padding: 10px;
        font-size: 15px;
        outline: none;
    }

    textarea {
        background-color: white;
        border: 1px solid #c55160;
        border-radius: 8px;
        padding: 10px;
        font-size: 15px;
        width: 300px;
        height: 100px;
        resize: vertical;
        box-sizing: border-box;
    }

    select {
        background-color: white;
        border: 1px solid #c55160;
        border-radius: 8px;
        padding: 10px;
        font-size: 15px;
        cursor: pointer;
    }

    label {
        font-size: 20px;
    }

    h1 {
        background-color: #ffffff;
        color: #000000;
        padding: 5px 15px;
        margin: 0;
    }

    .boton {
        display: inline-block;
        background-color: #c55160;
        color: white;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 8px;
        margin: 5px;
        border: none;
        font-size: 16px;
    }

    .boton:hover {
        background-color: #a83e4d;
    }

</style>

<form th:action="@{/gestor-de-tareas/tareas/nueva}" method="post">
    <label for="titulo">Título:</label>
    <br>
    <input type="text" id="titulo" name="titulo" required>

    <br><br>

    <label for="descripcion">Descripción:</label>
    <br>
    <textarea id="descripcion" name="descripcion"></textarea>

    <br><br>

    <label for="categoria">Categoría:</label>
    <br>
    <select id="categoria" name="idCategoria" required>
        <option value="">Selecciona una categoría</option>

        <option th:each="categoria : ${categorias}"
                th:value="${categoria.id}"
                th:text="${categoria.nombre}">
        </option>
    </select>

    <br><br>

    <label for="fechaLimite">Fecha límite:</label>
    <br>
    <input type="date" id="fechaLimite" name="fechaLimite" required>

    <br><br>

    <label for="prioridad">Prioridad:</label>
    <br>
    <select id="prioridad" name="prioridad" required>
        <option value="">Selecciona una prioridad</option>
        <option value="ALTA">Alta</option>
        <option value="MEDIA">Media</option>
        <option value="BAJA">Baja</option>
    </select>

    <br><br>

    <label>Usuario asignado:</label>
    <br>
    <select id="usuarioId" name="usuarioId">
        <option value="">Sin asignar</option>
        <option th:each="usuario : ${usuarios}"
                th:value="${usuario.id}"
                th:text="${usuario.nombre}">
        </option>
    </select>

    <br><br>

    <button type="submit" class="boton">Crear tarea</button>
    <a class="boton" th:href="@{/gestor-de-tareas/tareas}">Volver a mis tareas</a>
</form>

</body>
</html>
